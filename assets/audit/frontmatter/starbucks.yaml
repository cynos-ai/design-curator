version: alpha
name: Starbucks-Inspired-design-analysis
description: 'Starbucks'' design system is a **warm, confident retail flagship** wearing the green of their storefront
  apron across every surface. The canvas alternates between a neutral-warm cream (`#f2f0eb`) and a ceramic off-white
  (`#edebe9`) — colors that reference actual store materials: the paper napkins, the café walls, the wood finishes
  — while the signature **Starbucks Green** (`#006241`) anchors the brand moment on hero bands, CTAs, and the Rewards
  experience. The greens come in four calibrated shades (Starbucks, Accent, House, Uplift) each mapped to a specific
  surface role, and gold (`#cba258`) appears only around Rewards-status ceremony — not as a general accent.'
