version: alpha
name: Sanity-Inspired-design-analysis
description: 'Sanity''s website is a developer-content platform rendered as a nocturnal command center -- dark,
  precise, and deeply structured. The entire experience sits on a near-black canvas (`#0b0b0b`) that reads less
  like a "dark mode toggle" and more like the natural state of a tool built for people who live in terminals. Where
  most CMS marketing pages reach for friendly pastels and soft illustration, Sanity leans into the gravity of its
  own product: structured content deserves a structured stage.'
